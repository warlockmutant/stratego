name: Check YouTube Search
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube hookdeck bridge # Tells GitHub to look inside your folder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Fixed the warning by updating to Node 22

      - name: Install dependencies
        run: npm install

      - name: Execute script
        run: node index.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HOOKDECK_SOURCE_URL: ${{ secrets.HOOKDECK_SOURCE_URL }}
